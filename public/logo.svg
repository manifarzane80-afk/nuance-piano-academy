      stroke="#C6A15B"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
    />
  </g>

  <!-- WORDMARK -->
  <g transform="translate(285 72)">

    <!-- Persian name -->
    <text
      x="0"
      y="88"
      fill="url(#gold)"
      font-size="76"
      font-weight="700"
      font-family="Vazirmatn, Tahoma, Arial, sans-serif"
      direction="rtl"
      unicode-bidi="bidi-override"
    >نوانس</text>

    <!-- English -->
    <text
      x="5"
      y="124"
      fill="#E8E0D0"
      font-size="22"
      font-weight="500"
      font-family="Arial, sans-serif"
      letter-spacing="8"
    >NUANCE</text>

    <!-- separator -->
    <line
      x1="7"
      y1="145"
      x2="300"
      y2="145"
      stroke="#C6A15B"
      stroke-width="1"
      opacity="0.35"
    />

    <!-- academy -->
    <text
